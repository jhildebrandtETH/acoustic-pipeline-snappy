[project]
name = "foamacoustics"
version = "0.1.0"
description = "Farassat 1A acoustics tools for OpenFOAM surface data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.0",
    "scienceplots>=2.2.2",
    "pyvista>=0.48.4",
    "torch",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.3.0",
    "vtk>=9.6.2",
]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "types-tqdm>=4.68.0",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foamacoustics"]

[tool.mypy]
files = ["src/foamacoustics", "tests", "plot_*.py"]
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
