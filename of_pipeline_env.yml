name: of_pipeline_env

channels:
  - defaults

dependencies:
  - python=3.12
  - pip

  - pip:
      # CPU-only PyTorch build used by the acoustic solver.
      # Keep this extra index directly before the torch package.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.13.0+cpu

      # Direct dependencies of the CFD/acoustic pipeline.
      - docker==7.1.0
      - h5py>=3.10,<4
      - trimesh==4.12.2
      - numpy>=2,<3
      - pandas>=2.2,<3
      - matplotlib>=3.11,<4
      - reportlab>=4.1,<5

      # Geometry, visualization and Courant diagnostics.
      - pyvista>=0.48.4
      - vtk>=9.6.2,<10

      # Acoustic plotting and progress reporting.
      - scienceplots>=2.2.2
      - tqdm>=4.68.4

      # Bundled notebooks and pipeline regression tests.
      - ipykernel>=7.3.0
      - pypdf>=6,<7

      # Install FoamAcoustics and its own package dependencies from the
      # bundled source. Run `conda env create/update` from the repository root.
      - -e ./acousticSolver
